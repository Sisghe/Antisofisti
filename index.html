<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antisofisti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    #motto {
      font-size: 1.25rem;
      height: 2rem;
      margin-bottom: 3rem;
      font-style: italic;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-accesso { background-color: #1a1a1a; color: white; }
    .btn-registrati { background-color: #4a90e2; color: white; }
    .btn-ospite { background-color: #e0e0e0; color: #333; }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>Antisofisti</h1>
  <div id="motto"></div>

  <div class="btn-group">
    <button class="btn-accesso">🔐 Accedi</button>
    <button class="btn-registrati">🆕 Registrati con CIE</button>
    <button class="btn-ospite">👁️ Continua senza accedere</button>
  </div>

  <script>
    const motti = [
      "So di non sapere. – Socrate",
      "La vera ignoranza è rifiutare la conoscenza. – Popper",
      "Chi pensa è libero. Chi obbedisce ciecamente è schiavo. – Seneca",
      "Dubita di tutto, ma non del tuo pensiero critico. – Cartesio remix"
    ];

    const mottoEl = document.getElementById('motto');
    const motto = motti[Math.floor(Math.random() * motti.length)];
    let i = 0;

    function scriviMotto() {
      if (i < motto.length) {
        mottoEl.textContent += motto.charAt(i);
        i++;
        setTimeout(scriviMotto, 50);
      }
    }

    window.onload = scriviMotto;
  </script>
</body>
</html>
